<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asthma Care Gaps &mdash; HFFCC</title>
<link rel="icon" type="image/png" href="/ppd/heart.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabulator/6.3.0/css/tabulator.min.css">
<link rel="stylesheet" href="Asthma.css">
</head>
<body>

<header class="page-header">
  <div class="header-inner">
    <div class="header-title">
      <h1>Asthma Care Gaps</h1>
      <p class="subtitle">Patients with an asthma diagnosis on file, most recent qualifying encounter within 12 months</p>
    </div>
    <div class="header-meta">
      <span id="generatedAt" class="meta-pill">&mdash;</span>
    </div>
  </div>
</header>

<main>

  <section class="view-controls">
    <div class="provider-select-wrap">
      <label for="providerSelect">View</label>
      <select id="providerSelect"></select>
    </div>
  </section>

  <!-- ============== CLINIC OVERVIEW ============== -->
  <section id="clinicView" class="view-panel">

    <div class="stat-row">
      <div class="stat-card stat-card--total">
        <span class="stat-value" id="statTotal">&ndash;</span>
        <span class="stat-label">Total asthma patients</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statAdultTotal">&ndash;</span>
        <span class="stat-label">Adults (18+)</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statPedTotal">&ndash;</span>
        <span class="stat-label">Pediatric (&lt;18)</span>
      </div>
    </div>

  </section>

  <section class="detail-section">
    <div class="detail-header">
      <h2>Patient detail</h2>
      <div class="detail-controls">
        <div class="age-toggle" role="group" aria-label="Age bucket filter">
          <button class="toggle-pill active" data-age="all" type="button">All Ages</button>
          <button class="toggle-pill" data-age="Pediatric" type="button">Pediatric</button>
          <button class="toggle-pill" data-age="Adult" type="button">Adult</button>
        </div>
        <input type="text" id="quickFilter" placeholder="Filter by name or MRN&hellip;" class="field-input quick-filter">
        <button id="downloadCsv" class="btn-secondary">Download CSV</button>
      </div>
    </div>
    <div id="patientTable"></div>
  </section>

</main>

<footer class="page-footer">
  <p>Source: <code>Asthma.py</code> monthly snapshot &middot; HealthFirst Family Care Center</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tabulator/6.3.0/js/tabulator.min.js"></script>
<script src="Asthma.js"></script>
</body>
</html>
